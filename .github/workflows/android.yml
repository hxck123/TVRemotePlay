name: Android CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      
    - name: Update gradle.properties to remove proxy settings
      run: |
        sed -i '/systemProp.http.proxyHost/d' gradle.properties
        sed -i '/systemProp.http.proxyPort/d' gradle.properties
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Clean Gradle cache
      run: ./gradlew clean --no-daemon
      
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

    - name: Run tests
      run: ./gradlew test --no-daemon

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: IMEService/build/outputs/apk/debug/IMEService-debug.apk
