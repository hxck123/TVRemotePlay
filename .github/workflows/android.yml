name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Set up Java JDK
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 8
        cache: gradle

    # Remove proxy settings that might interfere with build
    - name: Remove proxy settings
      run: |
        git config --global --unset http.proxy || true
        git config --global --unset https.proxy || true
        echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties
        echo "org.gradle.parallel=true" >> gradle.properties
        echo "org.gradle.caching=true" >> gradle.properties

    # Make gradlew executable
    - name: Make Gradlew Executable
      run: chmod +x ./gradlew

    # Cache Gradle packages
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
        restore-keys: ${{ runner.os }}-gradle

    # Download dependencies
    - name: Download Dependencies
      run: ./gradlew androidDependencies --no-daemon

    # Build the project
    - name: Build Project
      run: ./gradlew build --no-daemon --warning-mode all

    # Build APK
    - name: Build Debug APK
      run: ./gradlew :IMEService:assembleDebug --no-daemon
      env:
        JAVA_OPTS: -Xmx2048m

    # Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: IMEService/build/outputs/apk/debug/
